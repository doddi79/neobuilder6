[build-system]
requires = [ "setuptools>=77", "wheel" ]
build-backend = "setuptools.build_meta"

[project]
name = "neobuilder6"
dynamic = ["version"]
description = "Builds Neobuf Packages from Protobuf files using Protoplasm6! :D (a continuation fork of CCP Games' neobuilder)"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
authors = [
    { name = "Thordur Matthiasson", email = "doddi79@gmail.com" }
]
keywords = [ "protobuf", "proto", "grpc", "protoplasm", "protoplasm6", "neobuf", "dataclasses", "codegen", "tools", "utils" ]
classifiers = [
    "Development Status :: 5 - Production/Stable",

    "Intended Audience :: Developers",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]

dependencies = [
    "protoplasm6 >=6.2, <7",
    "batutils >=2.2, <3",
    "grpcio-tools >=1.80, <2",
    "Jinja2 >=3.1, <4",
    "semver >=3.0.2, <4"
]

[project.scripts]
neobuild = "neobuilder6.cli.neobuilder:main"
neobuild6 = "neobuilder6.cli.neobuilder:main"

[project.urls]
Homepage = "https://github.com/doddi79/neobuilder6"
Documentation = "https://github.com/doddi79/neobuilder6/blob/main/README.md"
Repository = "https://github.com/doddi79/neobuilder6.git"
Issues = "https://github.com/doddi79/neobuilder6/issues"
Changelog = "https://github.com/doddi79/neobuilder6/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "neobuilder6.__version__"}

[tool.setuptools.packages.find]
where = [ "." ]
include = [ "neobuilder6", "neobuilder6.*" ]

[tool.setuptools.package-data]
neobuilder6 = [ "data/templates/*.jinja2", "data/templates/*/*.jinja2" ]
